<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Claim Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#0A0C13; --panel:#12141F; --panel2:#191C2A;
    --border:#262A3B; --border2:#383E56;
    --text:#FFFFFF; --dim:#9BA1B7; --dimmer:#666C82;
    --purple:#8B7CFF; --purple2:#6F5FF0;
    --mint:#2FE0A8; --mint2:#5FEFC2;
    --red:#FF5C7A; --gold:#F2B84B; --gold2:#F7C36E;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .fh{font-family:'Space Grotesk',sans-serif;}
  .fm{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::-webkit-scrollbar{height:6px;width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

  .wrap{min-height:100vh;padding-bottom:64px;}
  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .max-sm{width:100%;max-width:380px;}
  .max-lg{width:100%;max-width:1080px;margin:0 auto;}

  .sticky-head{position:sticky;top:0;background:rgba(10,12,19,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:14px 16px;z-index:20;}
  .row{display:flex;align-items:center;}
  .row-between{display:flex;align-items:center;justify-content:space-between;}
  .gap-2{gap:8px;} .gap-3{gap:12px;} .gap-1{gap:4px;}
  .icon-btn{background:none;border:none;color:var(--dimmer);cursor:pointer;padding:6px;display:flex;align-items:center;transition:color .15s;}
  .icon-btn:hover{color:#fff;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;font-weight:600;font-size:14px;border:none;cursor:pointer;transition:filter .15s,border-color .15s,color .15s,opacity .15s;}
  .btn-primary{background:linear-gradient(90deg,var(--purple),var(--purple2));color:#fff;}
  .btn-primary:hover{filter:brightness(1.1);}
  .btn-ghost{background:var(--panel);border:1px solid var(--border);color:var(--dim);}
  .btn-ghost:hover{border-color:var(--border2);color:#fff;}
  .btn-mint{background:var(--mint);color:var(--bg);}
  .btn-mint:hover{filter:brightness(1.08);}
  .btn-sm{padding:8px 14px;font-size:12.5px;border-radius:10px;}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.5;cursor:default;}
  .link-btn{background:none;border:none;cursor:pointer;font-family:inherit;font-size:12px;padding:0;}

  .input{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:#fff;font-size:14px;outline:none;font-family:inherit;}
  .input:focus{border-color:var(--purple);}
  .input::placeholder{color:var(--dimmer);}
  .label{color:var(--dim);font-size:12px;font-weight:600;display:block;margin-bottom:6px;}
  .field{margin-bottom:10px;}
  .err{color:var(--red);font-size:12px;margin:2px 0 8px;}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;}
  .empty{text-align:center;padding:56px 16px;color:var(--dimmer);}
  .empty svg{opacity:.5;margin-bottom:10px;}

  .badge{font-size:11px;border-radius:999px;padding:4px 11px;display:inline-block;font-weight:600;white-space:nowrap;}
  .badge-available{background:rgba(47,224,168,.15);color:var(--mint2);}
  .badge-claimed{background:var(--panel2);border:1px solid var(--border2);color:var(--dimmer);font-weight:500;}
  .badge-paid{background:rgba(47,224,168,.15);color:var(--mint2);}
  .badge-unpaid{background:rgba(255,92,122,.15);color:var(--red);}

  .tabbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
  .tab{font-size:12.5px;font-weight:600;padding:9px 15px;border-radius:999px;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--dimmer);white-space:nowrap;flex-shrink:0;}
  .tab.active{background:var(--purple);border-color:var(--purple);color:#fff;}

  .stats-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;flex:1;min-width:118px;}
  .stat .lab{font-size:10.5px;color:var(--dimmer);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;}
  .stat .val{font-size:18px;font-weight:700;}

  .grid-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  @media(min-width:560px){.grid-cards{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:820px){.grid-cards{grid-template-columns:repeat(4,1fr);}}

  .card-tile{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
  .card-tile.dim{opacity:.55;}
  .thumb{aspect-ratio:1/1;background:var(--panel2);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .thumb img{width:100%;height:100%;object-fit:cover;}
  .card-body{padding:10px;display:flex;flex-direction:column;flex:1;}
  .card-name{font-weight:600;font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-set{color:var(--dimmer);font-size:10px;margin-top:2px;}
  .card-price{color:var(--mint2);font-weight:600;font-size:13px;}

  .list-row{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px;display:flex;gap:12px;}
  .row-thumb{width:60px;height:60px;border-radius:10px;background:var(--panel2);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .row-thumb img{width:100%;height:100%;object-fit:cover;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0;}
  @media(min-width:600px){.modal-overlay{align-items:center;padding:24px;}}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:420px;padding:20px;max-height:92vh;overflow-y:auto;}
  @media(min-width:600px){.modal{border-radius:20px;}}
  .modal-lg{max-width:520px;}

  .imgpick{width:100%;aspect-ratio:1/1;max-width:160px;border-radius:12px;background:var(--panel2);border:1px dashed var(--border2);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;color:var(--dimmer);flex-direction:column;gap:6px;font-size:11px;text-align:center;}
  .imgpick img{width:100%;height:100%;object-fit:cover;}

  .buyer-row{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;}
  .invoice-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .invoice-line:last-child{border-bottom:none;}

  .lightbox-overlay{position:fixed;inset:0;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;z-index:60;padding:24px;}
  .lightbox-overlay img{max-width:100%;max-height:100%;border-radius:12px;object-fit:contain;}

  .settings-section{margin-bottom:22px;}
  .settings-section h3{font-size:14px;margin:0 0 4px;}
  .settings-section .sub{color:var(--dimmer);font-size:12px;margin:0 0 14px;line-height:1.5;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:480px){.form-grid{grid-template-columns:1fr;}}
  .status-dot{width:8px;height:8px;border-radius:999px;display:inline-block;margin-right:6px;}
  .code-block{background:#05060A;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:10.5px;line-height:1.55;color:var(--dim);overflow-x:auto;white-space:pre;max-height:280px;overflow-y:auto;}
  .step{display:flex;gap:10px;font-size:12.5px;color:var(--dim);margin-bottom:8px;line-height:1.5;}
  .step b{color:#fff;flex-shrink:0;}

  @media print{
    body *{visibility:hidden;}
    #invoiceArea, #invoiceArea *{visibility:visible;}
    #invoiceArea{position:absolute;top:0;left:0;width:100%;background:#fff;color:#000;padding:24px;}
    #invoiceArea .fm{color:#000;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- Supabase config ----------
   Fill these in from Project Settings > API in your Supabase project.
   Both values are meant to be public — real security comes from the
   Row Level Security policies and functions defined in supabase-setup.sql. */
const SUPABASE_URL = 'https://jxdgnsabchfchaojxbsi.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_WDJ6YYHose-pwMeGWrXDxg_LCGE8tCZ';

const SUPABASE_CONFIGURED = SUPABASE_URL.startsWith('http') && SUPABASE_ANON_KEY.length > 20;
const sb = SUPABASE_CONFIGURED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ---------- data mapping: DB row (snake_case) <-> app card object (camelCase) ---------- */
function rowToCard(r){
  return {
    id: r.id,
    name: r.name,
    set: r.card_number || '',
    price: Number(r.price),
    costPrice: (r.cost_price===undefined || r.cost_price===null) ? null : Number(r.cost_price),
    imageUrl: r.image_url || '',
    claimedBy: r.claimed_first ? {firstName:r.claimed_first, lastName:r.claimed_last, phone:r.claimed_phone} : null,
    claimedAt: r.claimed_at ? new Date(r.claimed_at).getTime() : null,
    paid: !!r.paid,
    createdAt: r.created_at ? new Date(r.created_at).getTime() : Date.now(),
  };
}

/* ---------- state ---------- */
let state = {
  view:'landing', configLoaded:false, saleConfig:null,
  saleId:null, sellerPin:null, realtimeChannel:null,
  cards:[], loadingCards:true, refreshing:false, pollHandle:null,
  pinInput:'', pinConfirm:'', pinError:'', showPin:false, saleTitleInput:'',
  sellerTab:'catalog',
  showAddForm:false, editingCardId:null,
  cardForm:{name:'',set:'',price:'',costPrice:'',imageUrl:''}, addError:'', saving:false,
  catalogSearch:'', catalogFilter:'all',
  claimTarget:null, claimForm:{firstName:'',lastName:'',phone:''}, claiming:false, claimError:'', claimSuccess:false,
  filterAvailableOnly:true, lookupPhone:'', showLookup:false,
  invoiceBuyerPhone:null,
  buyerProfile:null, showBuyerIntake:false, buyerIntakeForm:{firstName:'',lastName:'',phone:''}, buyerIntakeError:'',
  lightboxImg:null,
  settingsForm:null, settingsSaved:false,
  sheetsUrlInput:'', sheetsTesting:false, sheetsStatus:'unknown', sheetsMsg:'', lastSyncAt:null, showSheetsCode:false,
  loadingFromSheet:false,
};

function saleIdFromUrl(){
  return new URLSearchParams(window.location.search).get('sale') || null;
}
function sellerPinKey(){ return 'ccb_seller_pin_'+state.saleId; }
function cacheSellerPin(pin){
  state.sellerPin = pin;
  try{ localStorage.setItem(sellerPinKey(), pin); }catch(e){}
}
function loadCachedSellerPin(){
  try{ return localStorage.getItem(sellerPinKey()); }catch(e){ return null; }
}

const LS_BUYER_KEY = 'ccb_buyer_profile_v1';
function loadBuyerProfile(){
  try{
    const raw = localStorage.getItem(LS_BUYER_KEY);
    if(raw) state.buyerProfile = JSON.parse(raw);
  }catch(e){}
}
function saveBuyerProfile(p){
  state.buyerProfile = p;
  try{ localStorage.setItem(LS_BUYER_KEY, JSON.stringify(p)); }catch(e){}
}


function setPath(path,val){
  const parts=path.split('.'); let o=state;
  for(let i=0;i<parts.length-1;i++) o=o[parts[i]];
  o[parts[parts.length-1]]=val;
}
function getPath(path){
  const parts=path.split('.'); let o=state;
  for(const p of parts) o=o[p];
  return o;
}

function fmt(n){ return 'R'+Number(n||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normPhone(p){ return (p||'').replace(/\s|-/g,''); }

const SETTINGS_DEFAULTS = {
  title:'Card Claim Sale', businessName:'', contactInfo:'', bankName:'', accountNumber:'', accountHolder:'',
  branchCode:'', refPrefix:'', paymentTerms:'', sheetsUrl:''
};
function cfg(){ return {...SETTINGS_DEFAULTS, ...(state.saleConfig||{})}; }
async function saveSettings(fields){
  if(!sb || !state.saleId || !state.sellerPin) return;
  const payload = {
    title: fields.title, business_name: fields.businessName, contact_info: fields.contactInfo,
    bank_name: fields.bankName, account_holder: fields.accountHolder, account_number: fields.accountNumber,
    branch_code: fields.branchCode, ref_prefix: fields.refPrefix, payment_terms: fields.paymentTerms,
    sheets_url: fields.sheetsUrl,
  };
  if(fields.newPin) payload.new_pin = fields.newPin;
  const { error } = await sb.rpc('admin_action', {p_sale_id:state.saleId, p_pin:state.sellerPin, p_action:'update_settings', p_payload:payload});
  if(error){ console.error(error); return; }
  state.saleConfig = {...cfg(), ...fields};
  if(fields.newPin) cacheSellerPin(fields.newPin);
}

function renderConfigWarning(){
  if(SUPABASE_CONFIGURED) return '';
  return `<div class="panel" style="padding:12px 14px;margin-bottom:16px;border-color:var(--red);display:flex;gap:10px;align-items:flex-start;">
    <span style="color:var(--red);flex-shrink:0;">${ICON.lock}</span>
    <p style="color:var(--dim);font-size:12px;line-height:1.5;margin:0;"><b style="color:var(--red);">Not connected:</b> this file still has placeholder Supabase credentials. Open it in a text editor, set SUPABASE_URL and SUPABASE_ANON_KEY near the top of the &lt;script&gt; tag to your project's values, then reload.</p>
  </div>`;
}

function buildBuyerLink(){
  try{
    const url = new URL(window.location.href);
    url.searchParams.set('view','buyer');
    if(state.saleId) url.searchParams.set('sale', state.saleId);
    url.hash='';
    return url.toString();
  }catch(e){
    return window.location.href;
  }
}

function renderShareCard(){
  const link = buildBuyerLink();
  return `<div class="panel" style="padding:14px;margin-bottom:16px;">
    <div class="row gap-2" style="margin-bottom:10px;align-items:flex-start;">
      ${ICON.bagSm}
      <p style="color:var(--dim);font-size:12.5px;line-height:1.5;margin:0;">Generate a sale link that drops people straight into the shop \u2014 no landing page, just browse and claim. Share it in your WhatsApp group.</p>
    </div>
    <div class="row gap-2">
      <input class="input fm" readonly value="${esc(link)}" style="font-size:11px;" onclick="this.select()">
      <button class="btn btn-mint btn-sm" style="flex-shrink:0;" data-action="copy-buyer-link">Copy link</button>
    </div>
  </div>`;
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position='fixed'; ta.style.left='-9999px';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;
    }catch(e2){ return false; }
  }
}

async function copyBuyerLink(){
  const ok = await copyText(buildBuyerLink());
  const btn = document.querySelector('[data-action="copy-buyer-link"]');
  if(btn){ const old=btn.textContent; btn.textContent = ok?'Copied!':'Copy failed'; setTimeout(()=>{ if(btn) btn.textContent=old; },1500); }
}

/* ---------- Google Sheets sync (via Apps Script web app, JSONP) ---------- */
const APPS_SCRIPT_CODE = `function doGet(e){
  var action = (e.parameter.action || 'ping');
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var out;
  if(action === 'getCatalog'){
    out = { ok:true, cards: readCatalog_(ss) };
  } else if(action === 'sync'){
    var payload = JSON.parse(decodeURIComponent(e.parameter.data || '{}'));
    writeCatalog_(ss, payload.cards || []);
    writeBuyers_(ss, payload.buyers || []);
    out = { ok:true, cardsWritten:(payload.cards||[]).length, buyersWritten:(payload.buyers||[]).length };
  } else {
    out = { ok:true, ping:'pong' };
  }
  var cb = e.parameter.callback;
  var body = JSON.stringify(out);
  if(cb) return ContentService.createTextOutput(cb + '(' + body + ')').setMimeType(ContentService.MimeType.JAVASCRIPT);
  return ContentService.createTextOutput(body).setMimeType(ContentService.MimeType.JSON);
}
function doPost(e){ return doGet(e); }

function getOrCreateSheet_(ss, name, headers){
  var sh = ss.getSheetByName(name);
  if(!sh){ sh = ss.insertSheet(name); }
  if(sh.getLastRow() === 0){
    sh.getRange(1,1,1,headers.length).setValues([headers]).setFontWeight('bold').setBackground('#6F5FF0').setFontColor('#ffffff');
  }
  return sh;
}

function readCatalog_(ss){
  var sh = ss.getSheetByName('Catalog');
  if(!sh) return [];
  var last = sh.getLastRow();
  if(last < 2) return [];
  var rows = sh.getRange(2,1,last-1,4).getValues();
  var cards = [];
  rows.forEach(function(r){
    if(!r[0]) return;
    cards.push({ name:String(r[0]), set:String(r[1]||''), cost:parseFloat(r[2])||0, price:parseFloat(r[3])||0 });
  });
  return cards;
}

function writeCatalog_(ss, cards){
  var headers = ['Card','Card Number','Cost','Price','Status','Buyer','Phone','Sold Price','Paid','Date Sold'];
  var sh = getOrCreateSheet_(ss, 'Catalog', headers);
  var maxRows = Math.max(sh.getMaxRows()-1, 1);
  sh.getRange(2,1,maxRows,headers.length).clearContent();
  if(!cards.length) return;
  var rows = cards.map(function(c){
    return [c.name, c.set||'', (c.cost==null?'':c.cost), c.price, c.status||'', c.buyer||'', c.phone||'', (c.soldPrice==null?'':c.soldPrice), (c.paid?'Yes':''), c.dateSold||''];
  });
  sh.getRange(2,1,rows.length,headers.length).setValues(rows);
}

function writeBuyers_(ss, buyers){
  var headers = ['Buyer','Phone','Cards','Total','Paid','Owing'];
  var sh = getOrCreateSheet_(ss, 'Buyers', headers);
  var maxRows = Math.max(sh.getMaxRows()-1, 1);
  sh.getRange(2,1,maxRows,headers.length).clearContent();
  if(!buyers.length) return;
  var rows = buyers.map(function(b){
    return [b.name, b.phone, b.cards, b.total, b.paid, b.owing];
  });
  sh.getRange(2,1,rows.length,headers.length).setValues(rows);
}`;

function sheetsJSONP(url, params, timeoutMs){
  return new Promise((resolve, reject)=>{
    const cbName = 'ccbCb_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    const qs = Object.keys(params).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&');
    const sep = url.includes('?') ? '&' : '?';
    const script = document.createElement('script');
    let done = false;
    const cleanup = ()=>{ delete window[cbName]; if(script.parentNode) script.parentNode.removeChild(script); };
    window[cbName] = (data)=>{ if(done) return; done=true; cleanup(); resolve(data); };
    script.onerror = ()=>{ if(done) return; done=true; cleanup(); reject(new Error('Request failed \u2014 check the Web App URL and that it\u2019s deployed with access "Anyone".')); };
    script.src = url + sep + qs + '&callback=' + cbName;
    document.body.appendChild(script);
    setTimeout(()=>{ if(done) return; done=true; cleanup(); reject(new Error('Timed out contacting the sheet.')); }, timeoutMs||12000);
  });
}

function cardsPayloadForSheet(){
  return state.cards.map(c=>({
    name:c.name, set:c.set||'',
    cost: c.costPrice==null?null:c.costPrice,
    price:c.price,
    status: c.claimedBy?'Sold':'Available',
    buyer: c.claimedBy?(c.claimedBy.firstName+' '+c.claimedBy.lastName):'',
    phone: c.claimedBy?c.claimedBy.phone:'',
    soldPrice: c.claimedBy?c.price:null,
    paid: !!c.paid,
    dateSold: c.claimedAt? new Date(c.claimedAt).toLocaleDateString('en-ZA') : ''
  }));
}
function buyersPayloadForSheet(){
  return getBuyers().map(b=>({
    name: b.firstName+' '+b.lastName, phone:b.phone,
    cards: b.cards.map(c=>c.name).join(', '),
    total: b.total, paid: b.paidTotal, owing: b.owing
  }));
}

async function testSheetsConnection(){
  const url = state.sheetsUrlInput.trim();
  if(!url){ state.sheetsMsg='Paste your Web App URL first.'; render(); return; }
  state.sheetsTesting=true; state.sheetsMsg=''; render();
  try{
    const res = await sheetsJSONP(url, {action:'ping'});
    if(res && res.ok){
      await saveSettings({sheetsUrl:url});
      state.sheetsStatus='connected'; state.sheetsMsg='Connected successfully.';
    } else {
      state.sheetsStatus='error'; state.sheetsMsg='Unexpected response from the script.';
    }
  }catch(e){
    state.sheetsStatus='error'; state.sheetsMsg=e.message || 'Could not reach that URL.';
  }
  state.sheetsTesting=false; render();
}

async function loadCardsFromSheet(){
  const url = cfg().sheetsUrl;
  if(!url || !sb || !state.sellerPin) return;
  state.loadingFromSheet=true; state.sheetsMsg=''; render();
  try{
    const res = await sheetsJSONP(url, {action:'getCatalog'});
    if(!res || !res.ok) throw new Error('Sheet returned an error.');
    const incoming = res.cards || [];
    let added=0, updated=0;
    for(const row of incoming){
      if(!row.name) continue;
      const match = state.cards.find(c=> c.name.toLowerCase()===row.name.toLowerCase() && (c.set||'').toLowerCase()===(row.set||'').toLowerCase());
      const payload = {
        name: row.name, card_number: row.set||'',
        price: row.price || (match?match.price:0),
        cost_price: (row.cost!=null?row.cost:(match?match.costPrice:null)),
        image_url: match?match.imageUrl:'',
      };
      if(match) payload.id = match.id;
      const { error } = await sb.rpc('admin_action', {p_sale_id:state.saleId, p_pin:state.sellerPin, p_action:'upsert_card', p_payload:payload});
      if(!error){ match ? updated++ : added++; }
    }
    state.sheetsMsg = `Loaded from sheet: ${added} added, ${updated} updated.`;
    await loadCards(true);
  }catch(e){
    state.sheetsMsg = e.message || 'Could not load from the sheet.';
  }
  state.loadingFromSheet=false; render();
}

/* ---------- CSV export ---------- */
function csvEscape(v){
  const s = String(v==null?'':v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportCatalogCSV(){
  const rows = [['Card','Card Number','Cost','Price','Status','Buyer','Phone','Paid','Date Sold']];
  state.cards.forEach(c=>{
    rows.push([c.name, c.set||'', c.costPrice==null?'':c.costPrice, c.price, c.claimedBy?'Sold':'Available',
      c.claimedBy?(c.claimedBy.firstName+' '+c.claimedBy.lastName):'', c.claimedBy?c.claimedBy.phone:'',
      c.claimedBy?(c.paid?'Yes':'No'):'', c.claimedAt?new Date(c.claimedAt).toLocaleDateString('en-ZA'):'']);
  });
  downloadCSV('card-catalog.csv', rows);
}
function exportBuyersCSV(){

    rows.push([b.firstName+' '+b.lastName, b.phone, b.cards.map(c=>c.name).join('; '), b.total, b.paidTotal, b.owing]);

/* ---------- PDF invoice ---------- */
function generateInvoicePdf(buyer){
  if(!window.jspdf){ alert('PDF library failed to load \u2014 check your internet connection and try again.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const c = cfg();
  const marginX = 48; let y = 56;
  doc.setFont('helvetica','bold'); doc.setFontSize(18);
  doc.text(c.businessName || state.saleConfig?.title || 'Card Claim Sale', marginX, y); y+=20;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90);
  if(c.contactInfo){ doc.text(c.contactInfo, marginX, y); y+=14; }
  y+=10;
  doc.setDrawColor(220); doc.line(marginX, y, 547, y); y+=24;

  doc.setTextColor(20); doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('Billed to', marginX, y);
  doc.text('Invoice date', 380, y); y+=16;
  doc.setFont('helvetica','normal'); doc.setFontSize(11);
  doc.text(buyer.firstName+' '+buyer.lastName, marginX, y);
  doc.text(new Date().toLocaleDateString('en-ZA'), 380, y); y+=14;
  doc.setTextColor(120); doc.setFontSize(10);
  doc.text(buyer.phone, marginX, y); y+=28;

  doc.setTextColor(20); doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('Card', marginX, y); doc.text('Price', 460, y, {align:'right'}); doc.text('Status', 520, y, {align:'right'});
  y+=8; doc.setDrawColor(220); doc.line(marginX, y, 547, y); y+=16;
  doc.setFont('helvetica','normal');
  buyer.cards.forEach(card=>{
    doc.text(card.name + (card.set?'  #'+card.set:''), marginX, y);
    doc.text(fmt(card.price), 460, y, {align:'right'});
    doc.setTextColor(card.paid?[47,160,120]:[220,60,80]);
    doc.text(card.paid?'Paid':'Unpaid', 520, y, {align:'right'});
    doc.setTextColor(20);
    y+=18;
  });
  y+=6; doc.setDrawColor(220); doc.line(marginX, y, 547, y); y+=22;

  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text('Total', 400, y); doc.text(fmt(buyer.total), 547, y, {align:'right'}); y+=18;
  doc.setTextColor(buyer.owing>0?[220,60,80]:[47,160,120]);
  doc.text('Balance due', 400, y); doc.text(fmt(buyer.owing), 547, y, {align:'right'}); y+=32;
  doc.setTextColor(20);

  if(c.bankName || c.accountNumber){
    doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.text('Payment details', marginX, y); y+=16;
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(80);
    const lines = [];
    if(c.bankName) lines.push('Bank: '+c.bankName);
    if(c.accountHolder) lines.push('Account holder: '+c.accountHolder);
    if(c.accountNumber) lines.push('Account number: '+c.accountNumber);
    if(c.branchCode) lines.push('Branch code: '+c.branchCode);
    const ref = (c.refPrefix||'REF') + '-' + normPhone(buyer.phone).slice(-4);
    lines.push('Reference: '+ref);
    lines.forEach(l=>{ doc.text(l, marginX, y); y+=14; });
    y+=8;
  }
  if(c.paymentTerms){
    doc.setTextColor(120); doc.setFontSize(9);
    const wrapped = doc.splitTextToSize(c.paymentTerms, 500);
    doc.text(wrapped, marginX, y);
  }

  doc.save('invoice-'+(buyer.firstName+'-'+buyer.lastName).toLowerCase().replace(/\s+/g,'-')+'.pdf');
}


/* ---------- data loading ---------- */
async function loadSaleConfig(){
  state.configLoaded = false;
  if(sb && state.saleId){
    const { data, error } = await sb.from('sales').select('*').eq('id', state.saleId).single();
    if(!error && data){
      state.saleConfig = {
        title:data.title, businessName:data.business_name, contactInfo:data.contact_info,
        bankName:data.bank_name, accountHolder:data.account_holder, accountNumber:data.account_number,
        branchCode:data.branch_code, refPrefix:data.ref_prefix, paymentTerms:data.payment_terms,
        sheetsUrl:data.sheets_url,
      };
    }
  }
  state.configLoaded = true;
}

async function loadCards(silent){
  if(!sb || !state.saleId){ state.loadingCards=false; render(); return; }
  if(!silent){ state.loadingCards = true; render(); }
  state.refreshing = true;
  const { data, error } = await sb.from('cards').select('*').eq('sale_id', state.saleId).order('created_at', {ascending:true});
  if(!error && data){
    let costMap = {};
    if(state.sellerPin){
      const { data: adminData, error: adminErr } = await sb.rpc('admin_action', {p_sale_id:state.saleId, p_pin:state.sellerPin, p_action:'get_admin_cards', p_payload:{}});
      if(!adminErr && Array.isArray(adminData)){
        adminData.forEach(r=>{ costMap[r.id] = r.cost_price; });
      }
    }
    state.cards = data.map(r=>{
      const c = rowToCard(r);
      if(costMap.hasOwnProperty(r.id)) c.costPrice = (costMap[r.id]==null?null:Number(costMap[r.id]));
      return c;
    });
  }
  state.loadingCards = false;
  state.refreshing = false;
  render();
}

function startPolling(){
  stopPolling();
  state.pollHandle = setInterval(()=>loadCards(true), 15000);
}
function stopPolling(){
  if(state.pollHandle){ clearInterval(state.pollHandle); state.pollHandle=null; }
}
function startRealtime(){
  stopRealtime();
  if(!sb || !state.saleId) return;
  state.realtimeChannel = sb.channel('cards-'+state.saleId)
    .on('postgres_changes', {event:'*', schema:'public', table:'cards', filter:'sale_id=eq.'+state.saleId}, ()=>{ loadCards(true); })
    .subscribe();
}
function stopRealtime(){
  if(state.realtimeChannel){ sb.removeChannel(state.realtimeChannel); state.realtimeChannel=null; }
}

function setView(v){
  state.view = v;
  state.pinInput=''; state.pinConfirm=''; state.pinError='';
  if(v==='seller'||v==='buyer'){ loadCards(); startPolling(); startRealtime(); }
  else { stopPolling(); stopRealtime(); }
  render();
}

/* ---------- PIN flow ---------- */
async function goSeller(){
  state.pinInput=''; state.pinConfirm=''; state.pinError='';
  if(!state.saleId){ state.view='pin-setup'; render(); return; }
  const cached = loadCachedSellerPin();
  if(cached && sb){
    const { data, error } = await sb.rpc('verify_pin', {p_sale_id:state.saleId, p_pin:cached});
    if(!error && data===true){ state.sellerPin=cached; setView('seller'); return; }
  }

async function submitPinSetup(){
  if(!sb){ state.pinError='Not connected to Supabase yet.'; render(); return; }
  if(state.pinInput.length<4){ state.pinError='PIN must be at least 4 digits.'; render(); return; }
  if(state.pinInput!==state.pinConfirm){ state.pinError='PINs don\u2019t match.'; render(); return; }
  const title = state.saleTitleInput.trim() || 'Card Claim Sale';

  const { data, error } = await sb.rpc('verify_pin', {p_sale_id:state.saleId, p_pin:state.pinInput});

  }
}

/* ---------- image handling ---------- */
function handleImageFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const maxDim = 520;
      let w=img.width, h=img.height;
      if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      state.cardForm.imageUrl = canvas.toDataURL('image/jpeg',0.78);
      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveCard(){
  const f = state.cardForm;
  if(!f.name.trim() || !f.price){ state.addError='Card name and price are required.'; render(); return; }
  const priceNum = parseFloat(f.price);
  if(isNaN(priceNum) || priceNum<0){ state.addError='Enter a valid price.'; render(); return; }
  let costNum = null;
  if(f.costPrice.trim()!==''){
    costNum = parseFloat(f.costPrice);
    if(isNaN(costNum) || costNum<0){ state.addError='Enter a valid cost price, or leave it blank.'; render(); return; }
  }
  state.saving=true; state.addError=''; render();

  const payload = {
    name: f.name.trim(), card_number: f.set.trim(), price: priceNum,
    cost_price: costNum, image_url: f.imageUrl.trim(),
  };
  if(state.editingCardId) payload.id = state.editingCardId;
  const { error } = await sb.rpc('admin_action', {p_sale_id:state.saleId, p_pin:state.sellerPin, p_action:'upsert_card', p_payload:payload});
  if(error){ state.addError = 'Could not save \u2014 please try again.'; state.saving=false; render(); return; }

  state.saving=false;
  state.showAddForm=false; state.editingCardId=null;
  state.cardForm={name:'',set:'',price:'',costPrice:'',imageUrl:''};
  await loadCards(true);
  syncToSheetIfConfigured();
}

    state.claimError='Please fill in every field.'; render(); return;

/* ---------- derived data ---------- */
function availableCards(){ return state.cards.filter(c=>!c.claimedBy); }
function soldCards(){ return state.cards.filter(c=>c.claimedBy); }
function getBuyers(){
  const map = {};
  soldCards().forEach(c=>{
    const key = normPhone(c.claimedBy.phone);
    if(!map[key]) map[key] = {firstName:c.claimedBy.firstName, lastName:c.claimedBy.lastName, phone:c.claimedBy.phone, cards:[]};
    map[key].cards.push(c);
  });
  return Object.values(map).map(b=>({
    ...b,
    total: b.cards.reduce((s,c)=>s+c.price,0),
    owing: b.cards.filter(c=>!c.paid).reduce((s,c)=>s+c.price,0),
    paidTotal: b.cards.filter(c=>c.paid).reduce((s,c)=>s+c.price,0),
  })).sort((a,b)=>b.total-a.total);
}

ICON.catalog='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>';

ICON.sheet='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/></svg>';

/* ---------- render ---------- */
function render(){
  const app = document.getElementById('app');
  if(!state.configLoaded){
    app.innerHTML = `<div class="center-screen" style="color:var(--dimmer);font-size:14px;">Loading\u2026</div>`;
    return;
  }
  let html='';
  if(state.view==='landing') html = renderLanding();
  else if(state.view==='pin-setup') html = renderPinSetup();
  else if(state.view==='pin-enter') html = renderPinEnter();
  else if(state.view==='seller') html = renderSeller();
  else if(state.view==='buyer') html = renderBuyer();
  app.innerHTML = html;
}

function renderLanding(){
  const title = state.saleConfig ? esc(state.saleConfig.title) : 'Card Claim Board';
  const hasSale = !!state.saleId;
  return `
  <div class="center-screen">
    <div class="max-sm">
      <div style="text-align:center;margin-bottom:32px;">
        <div style="width:56px;height:56px;border-radius:18px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--purple),var(--gold));color:var(--bg);">${ICON.bag}</div>
        <h1 class="fh" style="font-size:21px;font-weight:700;margin:0;">${hasSale?title:'Card Claim Board'}</h1>
        <p style="color:var(--dimmer);font-size:14px;margin-top:6px;">Claim cards straight from the group chat</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        ${hasSale?`<button class="btn btn-primary btn-block" data-action="go-buyer">${ICON.bagSm} Browse &amp; claim a card</button>`:
          `<div class="panel" style="padding:12px 14px;"><p style="color:var(--dimmer);font-size:12.5px;line-height:1.5;margin:0;">Got a sale link from a seller? Open that link directly to browse and claim. This page has no sale loaded yet.</p></div>`}
        <button class="btn btn-ghost btn-block" data-action="go-seller">${ICON.lock} ${hasSale?'I\u2019m the seller':'Start a new sale'}</button>
      </div>
    </div>
  </div>`;
}

function renderPinSetup(){
  return `
  <div class="center-screen">
    <div class="max-sm">
      <button class="link-btn" data-action="set-view" data-view="landing" style="color:var(--dimmer);display:flex;align-items:center;gap:6px;margin-bottom:24px;font-size:13px;">${ICON.back} Back</button>
      <h2 class="fh" style="font-size:18px;font-weight:700;margin:0 0 4px;">Set up your claim sale</h2>
      <p style="color:var(--dimmer);font-size:13.5px;margin:0 0 22px;">You\u2019ll enter this PIN each time you come back to manage the sale.</p>
      <div class="field">
        <label class="label">Sale title</label>
        <input class="input" placeholder="e.g. Friday Night Claim Sale" value="${esc(state.saleTitleInput)}" data-bind="saleTitleInput" oninput="setPath('saleTitleInput',this.value)">
      </div>
      <div class="field">
        <label class="label">Create a PIN (4+ digits)</label>
        <div style="position:relative;">
          <input class="input" style="padding-right:40px;" type="${state.showPin?'text':'password'}" inputmode="numeric" placeholder="1234" value="${esc(state.pinInput)}" oninput="setPath('pinInput',this.value.replace(/\\D/g,''))">
          <button class="icon-btn" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);" data-action="toggle-pin-vis">${state.showPin?ICON.eyeOff:ICON.eye}</button>
        </div>
      </div>
      <div class="field">
        <label class="label">Confirm PIN</label>
        <input class="input" type="${state.showPin?'text':'password'}" inputmode="numeric" placeholder="1234" value="${esc(state.pinConfirm)}" oninput="setPath('pinConfirm',this.value.replace(/\\D/g,''))">
      </div>
      ${state.pinError?`<p class="err">${esc(state.pinError)}</p>`:''}
      <button class="btn btn-primary btn-block" style="margin-top:8px;" data-action="submit-pin-setup">Create sale</button>
      <p style="color:var(--dimmer);font-size:11px;line-height:1.5;padding-top:10px;">Heads up: this PIN is a light deterrent, not real security \u2014 don\u2019t reuse a password you care about, and don\u2019t list anything here you wouldn\u2019t want a determined stranger to see.</p>
    </div>
  </div>`;
}

function renderPinEnter(){
  return `
  <div class="center-screen">
    <div class="max-sm">
      <button class="link-btn" data-action="set-view" data-view="landing" style="color:var(--dimmer);display:flex;align-items:center;gap:6px;margin-bottom:24px;font-size:13px;">${ICON.back} Back</button>
      <h2 class="fh" style="font-size:18px;font-weight:700;margin:0 0 4px;">Enter your PIN</h2>
      <p style="color:var(--dimmer);font-size:13.5px;margin:0 0 22px;">${esc(state.saleConfig?.title||'')}</p>
      <div style="position:relative;margin-bottom:12px;">
        <input id="pinEnterInput" class="input" style="padding-right:40px;" type="${state.showPin?'text':'password'}" inputmode="numeric" autofocus placeholder="PIN" value="${esc(state.pinInput)}" oninput="setPath('pinInput',this.value.replace(/\\D/g,''))" onkeydown="if(event.key==='Enter') submitPinEnter()">
        <button class="icon-btn" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);" data-action="toggle-pin-vis">${state.showPin?ICON.eyeOff:ICON.eye}</button>
      </div>
      ${state.pinError?`<p class="err">${esc(state.pinError)}</p>`:''}
      <button class="btn btn-primary btn-block" data-action="submit-pin-enter">Enter</button>
    </div>
  </div>`;
}

function renderSeller(){
  const avail = availableCards(), sold = soldCards();
  const collected = sold.filter(c=>c.paid).reduce((s,c)=>s+c.price,0);
  const outstanding = sold.filter(c=>!c.paid).reduce((s,c)=>s+c.price,0);
  const hasCostData = state.cards.some(c=>c.costPrice!=null);
  const profitSold = sold.reduce((s,c)=>s+(c.price-(c.costPrice||0)),0);
  const profitPotential = avail.reduce((s,c)=>s+(c.price-(c.costPrice||0)),0);

  let body='';
  if(state.sellerTab==='catalog') body = renderCatalogTab(avail);
  else if(state.sellerTab==='sold') body = renderSoldTab(sold);
  else if(state.sellerTab==='buyers') body = renderBuyersTab();
  else if(state.sellerTab==='invoices') body = renderInvoicesTab();
  else if(state.sellerTab==='settings') body = renderSettingsTab();

  return `
  <div class="wrap">
    <div class="sticky-head">
      <div class="row-between">
        <div class="row gap-2" style="min-width:0;">
          <button class="icon-btn" data-action="set-view" data-view="landing">${ICON.back}</button>
          <div style="min-width:0;">
            <h1 class="fh" style="font-size:15px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(state.saleConfig?.title||'')}</h1>
            <p class="fm" style="color:var(--dimmer);font-size:11px;margin:0;">${avail.length} available &middot; ${sold.length} sold</p>
          </div>
        </div>
        <button class="icon-btn" data-action="refresh">${state.refreshing?ICON.refresh.replace('<svg','<svg style="animation:spin .8s linear infinite"'):ICON.refresh}</button>
      </div>
    </div>

    <div class="max-lg" style="padding:16px;">
      ${renderConfigWarning()}
      ${renderShareCard()}
      <div class="stats-row">
        <div class="stat"><div class="lab">Available</div><div class="val fm" style="color:var(--mint2);">${avail.length}</div></div>
        <div class="stat"><div class="lab">Sold</div><div class="val fm">${sold.length}</div></div>
        <div class="stat"><div class="lab">Collected</div><div class="val fm" style="color:var(--mint2);">${fmt(collected)}</div></div>
        <div class="stat"><div class="lab">Outstanding</div><div class="val fm" style="color:${outstanding>0?'var(--red)':'var(--dim)'};">${fmt(outstanding)}</div></div>
        ${hasCostData?`<div class="stat"><div class="lab">Profit (sold)</div><div class="val fm" style="color:var(--gold2);">${fmt(profitSold)}</div></div>
        <div class="stat"><div class="lab">Profit (potential)</div><div class="val fm" style="color:var(--dim);">${fmt(profitPotential)}</div></div>`:''}
      </div>

      <div class="tabbar" style="margin-bottom:18px;">
        <div class="tab ${state.sellerTab==='catalog'?'active':''}" data-action="set-seller-tab" data-tab="catalog">${ICON.catalog} Catalog</div>
        <div class="tab ${state.sellerTab==='sold'?'active':''}" data-action="set-seller-tab" data-tab="sold">${ICON.tag} Sold</div>
        <div class="tab ${state.sellerTab==='buyers'?'active':''}" data-action="set-seller-tab" data-tab="buyers">${ICON.users} Buyers</div>
        <div class="tab ${state.sellerTab==='invoices'?'active':''}" data-action="set-seller-tab" data-tab="invoices">${ICON.receipt} Invoices</div>
        <div class="tab ${state.sellerTab==='settings'?'active':''}" data-action="set-seller-tab" data-tab="settings">${ICON.gear} Settings</div>
      </div>

      ${body}
    </div>
  </div>
  ${state.claimTarget?renderClaimModal():''}
  ${state.invoiceBuyerPhone?renderInvoiceModal():''}
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  `;
}

function renderCatalogTab(avail){
  const q = state.catalogSearch.trim().toLowerCase();
  let list = state.cards.filter(c=> !q || c.name.toLowerCase().includes(q) || (c.set||'').toLowerCase().includes(q));
  if(state.catalogFilter==='available') list = list.filter(c=>!c.claimedBy);
  if(state.catalogFilter==='sold') list = list.filter(c=>c.claimedBy);

  return `
    <button class="btn btn-primary btn-block" style="margin-bottom:16px;" data-action="${state.showAddForm?'close-form':'open-add-form'}">${ICON.plus} ${state.showAddForm?'Cancel':'Add a card'}</button>

    <div id="addFormAnchor"></div>
    ${state.showAddForm?renderCardForm():''}

    <div class="row gap-2" style="margin-bottom:14px;flex-wrap:wrap;">
      <div style="position:relative;flex:1;min-width:160px;">
        <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dimmer);">${ICON.search}</span>
        <input class="input" style="padding-left:32px;" placeholder="Search catalog\u2026" value="${esc(state.catalogSearch)}" oninput="setPath('catalogSearch',this.value); filterCatalogLive()">
      </div>
      <div class="tabbar" style="flex:0 0 auto;">
        <div class="tab ${state.catalogFilter==='all'?'active':''}" data-action="set-catalog-filter" data-filter="all">All (${state.cards.length})</div>
        <div class="tab ${state.catalogFilter==='available'?'active':''}" data-action="set-catalog-filter" data-filter="available">Available (${avail.length})</div>
        <div class="tab ${state.catalogFilter==='sold'?'active':''}" data-action="set-catalog-filter" data-filter="sold">Sold (${state.cards.length-avail.length})</div>
      </div>
    </div>

    ${state.loadingCards?`<div class="empty">Loading cards\u2026</div>`:
      list.length===0?`<div class="empty">${ICON.bag}<p style="font-size:14px;">${state.cards.length===0?'No cards yet \u2014 add your first one above.':'No cards match your search.'}</p></div>`:
      `<div style="display:flex;flex-direction:column;gap:10px;">
        ${list.map(c=>`
          <div class="list-row">
            <div class="row-thumb">${c.imageUrl?`<img src="${esc(c.imageUrl)}" alt="" onerror="this.style.display='none'">`:ICON.imgOff}</div>
            <div style="flex:1;min-width:0;">
              <div class="row-between" style="align-items:flex-start;gap:8px;">
                <div style="min-width:0;">
                  <p style="font-weight:600;font-size:13.5px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(c.name)}</p>
                  ${c.set?`<p class="fm" style="color:var(--dimmer);font-size:11px;margin:2px 0 0;">#${esc(c.set)}</p>`:''}
                </div>
                <div style="text-align:right;flex-shrink:0;">
                  <span class="fm" style="color:var(--mint2);font-weight:600;font-size:13.5px;">${fmt(c.price)}</span>
                  ${c.costPrice!=null?`<p class="fm" style="color:var(--dimmer);font-size:10px;margin:2px 0 0;">cost ${fmt(c.costPrice)} &middot; <span style="color:var(--gold2);">+${fmt(c.price-c.costPrice)}</span></p>`:''}
                </div>
              </div>
              <div class="row-between" style="margin-top:8px;flex-wrap:wrap;gap:6px;">
                ${c.claimedBy?`<span class="badge badge-claimed">Claimed by <b style="color:#fff;">${esc(c.claimedBy.firstName)} ${esc(c.claimedBy.lastName)}</b></span>`:`<span class="badge badge-available">Available</span>`}
                <div class="row gap-1">
                  <button class="icon-btn" data-action="edit-card" data-id="${c.id}" title="Edit">${ICON.edit}</button>
                  ${c.claimedBy?`<button class="link-btn" style="color:var(--gold2);padding:4px 6px;" data-action="unclaim-card" data-id="${c.id}">Release</button>`:''}
                  <button class="icon-btn" style="color:var(--red);" data-action="delete-card" data-id="${c.id}" title="Delete">${ICON.trash}</button>
                </div>
              </div>
            </div>
          </div>
        `).join('')}
      </div>`
    }
  `;
}

function renderCardForm(){
  const f = state.cardForm;
  return `
    <div class="panel" style="padding:16px;margin-bottom:16px;">
      <h3 class="fh" style="font-size:14.5px;font-weight:700;margin:0 0 12px;">${state.editingCardId?'Edit card':'New card'}</h3>
      <div style="display:flex;gap:14px;flex-wrap:wrap;">
        <div>
          <label class="imgpick" for="imgFileInput">
            ${f.imageUrl?`<img src="${esc(f.imageUrl)}" alt="">`:`${ICON.camera}<span>Add photo</span>`}
          </label>
          <input id="imgFileInput" type="file" accept="image/*" style="display:none;" onchange="handleImageFile(this.files[0])">
        </div>
        <div style="flex:1;min-width:180px;">
          <div class="field"><input class="input" placeholder="Card name *" value="${esc(f.name)}" oninput="setPath('cardForm.name',this.value)"></div>
          <div class="field"><input class="input" placeholder="Card number (optional, e.g. 4/102)" value="${esc(f.set)}" oninput="setPath('cardForm.set',this.value)"></div>
          <div class="field"><input class="input" type="number" min="0" step="0.01" placeholder="Price (R) *" value="${esc(f.price)}" oninput="setPath('cardForm.price',this.value)"></div>
          <div class="field">
            <input class="input" type="number" min="0" step="0.01" placeholder="Your cost price (R, optional)" value="${esc(f.costPrice)}" oninput="setPath('cardForm.costPrice',this.value)">
            <p style="color:var(--dimmer);font-size:10.5px;margin:5px 2px 0;">Only visible to you \u2014 buyers never see this.</p>
          </div>
        </div>
      </div>
      <div class="field" style="margin-top:2px;">
        <label class="label">Or paste an image link</label>
        <input class="input" placeholder="https://\u2026" value="${(f.imageUrl||'').startsWith('data:')?'':esc(f.imageUrl)}" oninput="setPath('cardForm.imageUrl',this.value)">
      </div>
      ${state.addError?`<p class="err">${esc(state.addError)}</p>`:''}
      <button class="btn btn-mint btn-block" ${state.saving?'disabled':''} data-action="save-card">${state.saving?'Saving\u2026':(state.editingCardId?'Save changes':'Add to sale')}</button>
    </div>
  `;
}

function renderSoldTab(sold){
  if(state.loadingCards) return `<div class="empty">Loading\u2026</div>`;
  if(sold.length===0) return `<div class="empty">${ICON.tag}<p style="font-size:14px;">Nothing sold yet.</p></div>`;
  const sorted = [...sold].sort((a,b)=>b.claimedAt-a.claimedAt);
  return `<div style="display:flex;flex-direction:column;gap:10px;">
    ${sorted.map(c=>`
      <div class="list-row">
        <div class="row-thumb">${c.imageUrl?`<img src="${esc(c.imageUrl)}" alt="" onerror="this.style.display='none'">`:ICON.imgOff}</div>
        <div style="flex:1;min-width:0;">
          <div class="row-between" style="align-items:flex-start;gap:8px;">
            <div style="min-width:0;">
              <p style="font-weight:600;font-size:13.5px;margin:0;">${esc(c.name)}</p>
              <p style="color:var(--dim);font-size:12px;margin:3px 0 0;">${esc(c.claimedBy.firstName)} ${esc(c.claimedBy.lastName)} &middot; ${esc(c.claimedBy.phone)}</p>
              <p class="fm" style="color:var(--dimmer);font-size:10.5px;margin:3px 0 0;">${new Date(c.claimedAt).toLocaleString('en-ZA')}</p>
            </div>
            <div style="text-align:right;flex-shrink:0;">
              <span class="fm" style="color:var(--mint2);font-weight:600;font-size:13.5px;">${fmt(c.price)}</span>
              ${c.costPrice!=null?`<p class="fm" style="color:var(--dimmer);font-size:10px;margin:2px 0 0;">cost ${fmt(c.costPrice)} &middot; <span style="color:var(--gold2);">+${fmt(c.price-c.costPrice)}</span></p>`:''}
            </div>
          </div>
          <div class="row-between" style="margin-top:10px;flex-wrap:wrap;gap:6px;">
            <button class="badge ${c.paid?'badge-paid':'badge-unpaid'}" style="border:none;cursor:pointer;" data-action="toggle-paid" data-id="${c.id}">${c.paid?'\u2713 Paid':'Mark as paid'}</button>
            <div class="row gap-2">
              <button class="link-btn" style="color:var(--gold2);" data-action="unclaim-card" data-id="${c.id}">Release</button>
              <button class="icon-btn" style="color:var(--red);" data-action="delete-card" data-id="${c.id}">${ICON.trash}</button>
            </div>
          </div>
        </div>
      </div>
    `).join('')}
  </div>`;
}

function renderBuyersTab(){
  const buyers = getBuyers();
  if(state.loadingCards) return `<div class="empty">Loading\u2026</div>`;
  if(buyers.length===0) return `<div class="empty">${ICON.users}<p style="font-size:14px;">No buyers yet \u2014 claimed cards will group here by phone number.</p></div>`;
  return `<div>
    ${buyers.map(b=>`
      <div class="buyer-row">
        <div class="row-between" style="align-items:flex-start;">
          <div>
            <p class="fh" style="font-weight:700;font-size:14.5px;margin:0;">${esc(b.firstName)} ${esc(b.lastName)}</p>
            <p class="fm" style="color:var(--dimmer);font-size:12px;margin:3px 0 0;">${esc(b.phone)}</p>
          </div>
          <div style="text-align:right;">
            <p class="fm" style="font-weight:700;font-size:14.5px;margin:0;">${fmt(b.total)}</p>
            <p style="font-size:11px;margin:2px 0 0;color:${b.owing>0?'var(--red)':'var(--mint2)'};">${b.owing>0?fmt(b.owing)+' owing':'Fully paid'}</p>
          </div>
        </div>
        <div style="margin-top:10px;display:flex;flex-direction:column;gap:4px;">

/* ---------- event delegation ---------- */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;
  switch(a){
    case 'go-buyer': setView('buyer'); break;
    case 'go-seller': goSeller(); break;
    case 'set-view': setView(el.dataset.view); break;
    case 'toggle-pin-vis': state.showPin=!state.showPin; render(); break;
    case 'submit-pin-setup': submitPinSetup(); break;
    case 'submit-pin-enter': submitPinEnter(); break;
    case 'refresh': loadCards(); break;
    case 'set-seller-tab': state.sellerTab=el.dataset.tab; render(); break;
    case 'open-add-form': openAddForm(); break;
    case 'close-form': closeForm(); break;
    case 'edit-card': openEditForm(el.dataset.id); break;
    case 'save-card': saveCard(); break;
    case 'delete-card': deleteCard(el.dataset.id); break;
    case 'unclaim-card': unclaimCard(el.dataset.id); break;
    case 'cancel-claim': cancelMyClaim(el.dataset.id); break;
    case 'toggle-paid': togglePaid(el.dataset.id); break;
    case 'set-catalog-filter': state.catalogFilter=el.dataset.filter; render(); break;
    case 'open-invoice': state.invoiceBuyerPhone=el.dataset.phone; render(); break;
    case 'close-invoice': state.invoiceBuyerPhone=null; render(); break;
    case 'close-invoice-bg': if(e.target===el){ state.invoiceBuyerPhone=null; render(); } break;
    case 'print-invoice': window.print(); break;
    case 'copy-invoice': copyInvoiceSummary(el.dataset.phone); break;
    case 'copy-buyer-link': copyBuyerLink(); break;
    case 'open-claim': openClaim(el.dataset.id); break;
    case 'close-claim': closeClaim(); break;
    case 'close-claim-bg': if(e.target===el) closeClaim(); break;
    case 'submit-claim': submitClaim(); break;
    case 'toggle-lookup': state.showLookup=!state.showLookup; render(); break;
    case 'set-filter': state.filterAvailableOnly = el.dataset.val==='1'; render(); break;
    case 'open-lightbox': state.lightboxImg=el.dataset.img; render(); break;
    case 'close-lightbox': state.lightboxImg=null; render(); break;
    case 'edit-buyer-profile': openBuyerIntake(); break;
    case 'close-buyer-intake': state.showBuyerIntake=false; render(); break;
    case 'submit-buyer-intake': submitBuyerIntake(); break;
    case 'download-invoice-pdf': {
      const b = getBuyers().find(x=>normPhone(x.phone)===state.invoiceBuyerPhone);
      if(b) generateInvoicePdf(b);
      break;
    }
    case 'export-catalog-csv': exportCatalogCSV(); break;
    case 'export-buyers-csv': exportBuyersCSV(); break;
    case 'test-sheets-connection': testSheetsConnection(); break;
    case 'load-cards-from-sheet': loadCardsFromSheet(); break;
    case 'manual-sync-now': manualSyncNow(); break;
    case 'copy-apps-script': copyAppsScript(); break;
    case 'toggle-sheets-code': state.showSheetsCode=!state.showSheetsCode; render(); break;
    case 'save-invoice-settings': saveInvoiceSettingsFromForm(); break;
  }
});

async function copyInvoiceSummary(phone){
  const buyers = getBuyers();
  const b = buyers.find(x=>normPhone(x.phone)===phone);
  if(!b) return;
  const lines = [
    (state.saleConfig?.title||'Card Claim Sale'),
    `Buyer: ${b.firstName} ${b.lastName} (${b.phone})`,
    '',
    ...b.cards.map(c=>`- ${c.name}${c.set?' #'+c.set:''}: ${fmt(c.price)} ${c.paid?'(paid)':'(unpaid)'}`),
    '',
    `Total: ${fmt(b.total)}`,
    `Balance due: ${fmt(b.owing)}`
  ];
  const text = lines.join('\n');
  const ok = await copyText(text);
  const btn = document.querySelector('[data-action="copy-invoice"]');
  if(btn){ const old=btn.textContent; btn.textContent = ok?'Copied!':'Copy failed'; setTimeout(()=>{ if(btn) btn.textContent=old; },1500); }
}

/* ---------- init ---------- */
(async function init(){
  loadBuyerProfile();
  state.saleId = saleIdFromUrl();
  if(state.saleId) await loadSaleConfig(); else state.configLoaded = true;
  const params = new URLSearchParams(window.location.search);
  if(params.get('view')==='buyer' && state.saleId){
    setView('buyer');
  } else if(params.get('view')==='seller' && state.saleId){
    goSeller();
  } else {
    render();
  }
})();
</script>
